[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts/contracts-upgradeable/",
  "@solarity/solidity-lib/=lib/solidity-lib/",
  "morpheus-smart-contracts/=lib/morpheus-smart-contracts/",
  "forge-std/=lib/forge-std/src/"
]
